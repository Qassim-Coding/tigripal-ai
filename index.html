
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TigriPal AI - Traducteur Pro</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Traducteur vocal Multilingue pour les professionnels.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background-color: #f8fafc;
    }
    .messages-container {
      height: calc(100vh - 180px);
    }
    @font-face {
      font-family: 'Geez';
      src: local('Abyssinica SIL'), local('Noto Sans Ethiopic');
    }
    .font-geez { font-family: 'Geez', 'Inter', sans-serif; }
    
    .wave {
      display: inline-block;
      width: 3px;
      height: 10px;
      margin: 0 1px;
      background: currentColor;
      border-radius: 5px;
      animation: wave-anim 1s ease-in-out infinite;
    }
    .wave:nth-child(2) { animation-delay: 0.1s; }
    .wave:nth-child(3) { animation-delay: 0.2s; }
    .wave:nth-child(4) { animation-delay: 0.3s; }
    .wave:nth-child(5) { animation-delay: 0.4s; }
    @keyframes wave-anim {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(2.5); }
    }

    /* Avatar talk animation */
    .avatar-talking {
      animation: talk-bounce 0.4s ease-in-out infinite alternate;
    }
    @keyframes talk-bounce {
      from { transform: scale(1) translateY(0); }
      to { transform: scale(1.05) translateY(-2px); }
    }
    .mouth-open {
      animation: mouth-move 0.3s ease-in-out infinite;
    }
    @keyframes mouth-move {
      0%, 100% { height: 2px; }
      50% { height: 8px; }
    }
  </style>
